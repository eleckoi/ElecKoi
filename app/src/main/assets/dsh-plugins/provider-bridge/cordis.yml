- id: eleckoi-native-wire-providers
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      eleckoi-wire-responses:
        displayName: ElecKoi Responses wire
        apiKeyEnv: ELECKOI_PROVIDER_KEY
        api: openai-responses
        baseURL: !!js process.env.ELECKOI_HOST_TOOLS_URL.replace('/host-tools', '/provider-wire/responses/v1')
        models:
          - id: eleckoi-wire
            contextWindow: !!js Number(process.env.ELECKOI_CONTEXT_WINDOW ?? 262144)
            input: [text, image]
            reasoningEfforts:
              off:
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
      eleckoi-wire-chat:
        displayName: ElecKoi Chat Completions wire
        apiKeyEnv: ELECKOI_PROVIDER_KEY
        api: openai-completions
        baseURL: !!js process.env.ELECKOI_HOST_TOOLS_URL.replace('/host-tools', '/provider-wire/chat/v1')
        compat:
          supportsReasoningEffort: true
        models:
          - id: eleckoi-wire
            contextWindow: !!js Number(process.env.ELECKOI_CONTEXT_WINDOW ?? 262144)
            input: [text, image]
            reasoningEfforts:
              off:
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
      eleckoi-wire-chat-thinking:
        displayName: ElecKoi Chat Completions thinking wire
        apiKeyEnv: ELECKOI_PROVIDER_KEY
        api: openai-completions
        baseURL: !!js process.env.ELECKOI_HOST_TOOLS_URL.replace('/host-tools', '/provider-wire/chat-thinking/v1')
        compat:
          thinkingFormat: deepseek
          supportsReasoningEffort: true
        models:
          - id: eleckoi-wire
            contextWindow: !!js Number(process.env.ELECKOI_CONTEXT_WINDOW ?? 262144)
            input: [text, image]
            reasoningEfforts:
              off:
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
      eleckoi-wire-anthropic:
        displayName: ElecKoi Claude Messages wire
        apiKeyEnv: ELECKOI_PROVIDER_KEY
        api: anthropic-messages
        baseURL: !!js process.env.ELECKOI_HOST_TOOLS_URL.replace('/host-tools', '/provider-wire/anthropic')
        models:
          - id: eleckoi-wire
            contextWindow: !!js Number(process.env.ELECKOI_CONTEXT_WINDOW ?? 262144)
            input: [text, image]
            reasoningEfforts:
              off:
              minimal: minimal
              low: low
              medium: medium
              high: high
      google:
        displayName: ElecKoi Gemini wire
        apiKeyEnv: ELECKOI_PROVIDER_KEY
        baseURL: !!js process.env.ELECKOI_HOST_TOOLS_URL.replace('/host-tools', '/provider-wire/google')
        models:
          - id: eleckoi-wire
            contextWindow: !!js Number(process.env.ELECKOI_CONTEXT_WINDOW ?? 262144)
            input: [text, image]
            reasoningEfforts:
              off:
              minimal: minimal
              low: low
              medium: medium
              high: high

- id: eleckoi-provider-bridge
  name: ./provider-bridge.mjs
  config:
    baseUrl: !!js process.env.ELECKOI_HOST_TOOLS_URL
    model: !!js process.env.ELECKOI_MODEL
    contextWindow: !!js Number(process.env.ELECKOI_CONTEXT_WINDOW ?? 262144)
