# ElecKoi overlay for the official DSH sdk profile.
# The shipped dsh-base and dsh-sdk-app bundles own the runtime graph; this file
# only supplies product configuration and ElecKoi's session bridges.

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: !!js process.env.DSH_SYSTEM_PROMPT ?? ''
    personaSuffix: ''

- id: spill-local
  disabled: true

- id: spill-policy
  config:
    maxInlineTokens: 12500
    pagedTools: [eleckoi_read_setting_files, eleckoi_read_variables, eleckoi_call_capability, eleckoi_read_uploaded_file]

- id: attachment-local
  config:
    dshHome: !!js process.env.DSH_HOME
    maxImageBytes: !!js Number.MAX_SAFE_INTEGER
    maxImagesPerMessage: !!js Number.MAX_SAFE_INTEGER
    maxMessageImageBytes: !!js Number.MAX_SAFE_INTEGER
    maxImagePixels: !!js Number.MAX_SAFE_INTEGER
    maxImageDimension: !!js Number.MAX_SAFE_INTEGER

- id: connection
  config:
    maxRequestBodyBytes: !!js Math.ceil(Number.MAX_SAFE_INTEGER * 4 / 3) + 1048576

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  config:
    policy: ask

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: workspace-write

- id: web
  config:
    searchProvider: deepseek-official
    fetchProvider: http

- id: web-search-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: web-fetch-http
  config:
    maxResponseBytes: !!js Number.MAX_SAFE_INTEGER
    maxBodyChars: !!js Number.MAX_SAFE_INTEGER
    timeoutMs: 35000
    maxRedirects: 5

- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: true

# The SDK base profile keeps model-facing rows for a process-wide agent. ElecKoi
# composes them per Session through Agent Presets, matching DSH's own multi-
# session profile: host registries stay loaded while global tool rows are
# disabled so preset-scoped configuration and policy remain authoritative.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true
- id: session-title-llm
  disabled: true

- insert:
    - id: eleckoi-tool-result-store
      name: './tool-result-store.mjs'
      config:
        root: !!js dshHomePath('tool-results')

    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: eleckoi-default

    - id: agent-preset-bridge
      name: './agent-preset-bridge.mjs'

    - id: web-search-tavily
      name: './tavily-web-search.mjs'
