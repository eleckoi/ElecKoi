# The desktop Web Host owns ElecKoi's Agent Sessions and browser plugins.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ''
    personaSuffix: ''

- id: attachment-local
  config:
    dshHome: !!js process.env.DSH_HOME
    maxImageBytes: !!js Number.MAX_SAFE_INTEGER
    maxImagesPerMessage: !!js Number.MAX_SAFE_INTEGER
    maxMessageImageBytes: !!js Number.MAX_SAFE_INTEGER
    maxImagePixels: !!js Number.MAX_SAFE_INTEGER
    maxImageDimension: !!js Number.MAX_SAFE_INTEGER

- id: connection
  config:
    maxRequestBodyBytes: !!js Math.ceil(Number.MAX_SAFE_INTEGER * 4 / 3) + 1048576

- id: web-fetch-http
  config:
    maxResponseBytes: !!js Number.MAX_SAFE_INTEGER
    maxBodyChars: !!js Number.MAX_SAFE_INTEGER

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  config:
    policy: ask

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: workspace-write

- id: agent-preset-registry
  config:
    default: eleckoi-default

