# ElecKoi agent preset Agent plane. A runtime copy is materialized for every
# product preset and mounted through the DSH Agent preset registry.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 9007199254740991
    maxSourceBytes: 9007199254740991

- id: uploaded-file-tools
  name: __ELECKOI_UPLOADED_FILE_TOOLS_PLUGIN__

# ELECKOI:variables:BEGIN
- id: variable-tools
  name: __ELECKOI_VARIABLE_TOOLS_PLUGIN__
# ELECKOI:variables:END

# ELECKOI:setting-library:BEGIN
- id: setting-library-tools
  name: __ELECKOI_SETTING_LIBRARY_TOOLS_PLUGIN__
# ELECKOI:setting-library:END

# ELECKOI:web:BEGIN
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: true
    fetch: true
    searchMaxResults: 0
    searchMaxQueries: 9007199254740991
    searchTimeoutMs: 35000
    fetchTimeoutMs: 30000
    fetchMaxOutputChars: 0
# ELECKOI:web:END

# ELECKOI:workspace:BEGIN
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  config:
    enableRunInBackground: true

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
# ELECKOI:workspace:END

# ELECKOI:collaboration:BEGIN
- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 9007199254740991
    modelSelectionSettings: true

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 9007199254740991
# ELECKOI:collaboration:END

# ELECKOI:roleplay-workflow:BEGIN
- id: roleplay-plan-tool
  name: __ELECKOI_ROLEPLAY_PLAN_TOOL_PLUGIN__
  config:
    steps: __ELECKOI_ROLEPLAY_PLAN_STEPS__
# ELECKOI:roleplay-workflow:END

# ELECKOI:workflow:BEGIN
- id: workflow
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
# ELECKOI:workflow:END

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: __ELECKOI_COMPACTION_THRESHOLD_RATIO__
        __ELECKOI_COMPACTION_RETENTION__
        maxTokens: 8192
        compactionRetries: 1

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
