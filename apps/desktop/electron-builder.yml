appId: com.eleckoi.desktop
productName: ElecKoi
copyright: Copyright © ElecKoi

directories:
  output: ../../release

files:
  - out/**/*
  - resources/**/*
  - '!resources/native/**/*'
  - '!resources/installer/**/*'
  - '!node_modules/pnpm/**/*'
  - package.json

extraResources:
  - from: resources/native
    to: native
  - from: node_modules/pnpm
    to: dsh/pnpm
  - from: resources/dsh/node-bin
    to: dsh/node-bin

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/koffi/**/*

npmRebuild: false
afterPack: ./apps/desktop/scripts/windows-updater-config.cjs

publish:
  provider: github
  owner: eleckoi
  repo: ElecKoi
  releaseType: release

win:
  icon: resources/icons/eleckoi-app-icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

nsis:
  include: scripts/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: false
  perMachine: false
  allowElevation: false
  installerLanguages: [en_US, zh_CN, ja_JP, es_ES, fr_FR, de_DE, ru_RU, pt_BR]
  installerSidebar: resources/installer/ui/uninstaller-sidebar.bmp
  uninstallerSidebar: resources/installer/ui/uninstaller-sidebar.bmp
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ElecKoi
  deleteAppDataOnUninstall: false
