# ElecKoi's unattended DeepSeek Harness composition. Stdout is reserved for JSON-RPC.
- id: attachments
  name: '@deepseek-ai/dsh-attachment-local'
  config:
    dshHome: !!js process.env.DSH_HOME
    maxImagesPerMessage: 4
    maxImageBytes: 20971520
    maxMessageImageBytes: 20971520
    normalizedImageMaxDimension: 2048
    normalizedImageMaxBytes: 4194304
    imageCompressionConcurrency: 2

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  inject:
    - attachments
    - llm
  config:
    maxTokensAsSuccess: true

- id: llm
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      eleckoi:
        displayName: ElecKoi Android loopback
        apiKeyEnv: ELECKOI_PROVIDER_KEY
        api: openai-responses
        baseURL: !!js process.env.ELECKOI_PROVIDER_BASE_URL
        streamIdleTimeoutMs: 300000
        maxRequestImageBytes: 12582912
        requestImagePixelBudget: 4194304
        requestImageMaxBytes: 1048576
        models:
          - id: !!js process.env.ELECKOI_MODEL
            contextWindow: !!js Number(process.env.ELECKOI_CONTEXT_WINDOW ?? 262144)
            input:
              - text
              - image

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    landlockPath: !!js process.env.DSH_LANDLOCK_PATH ?? '/opt/eleckoi/bin/landlock-run'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: read-only
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: ask-for-approval
    presets:
      ask-for-approval:
        sandbox: read-only
        approval: ask
        name: 请求批准
        description: 修改文件或扩大工作区访问前询问
      approve-for-me:
        sandbox: workspace-write
        approval: ask
        name: 替我审批
        description: 工作区内自动执行，越界时询问
      full-access:
        sandbox: danger-full-access
        approval: never
        name: 完全访问
        description: 不限制 DSH 文件访问且不询问

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    # Story presets expose this line as an editable system-instruction entry. Keep the Harness
    # from silently adding a second, immutable copy ahead of Android-owned preset context.
    includeHarnessIdentity: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent running inside ElecKoi.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: !!js "process.env.ELECKOI_ENABLE_WORKSPACE_TOOLS === 'true' ? { enableRunInBackground: false } : false"
    toolJobs: false

# Session-scoped tools implemented by Android. The random URL path is created for one Harness
# process and contains no provider credential.
- id: eleckoi-host-tools
  name: ./eleckoi-host-tools.mjs
  disabled: !!js "!process.env.ELECKOI_HOST_TOOLS_URL || !process.env.ELECKOI_HOST_TOOL_CATALOG"
  config:
    baseUrl: !!js process.env.ELECKOI_HOST_TOOLS_URL

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: zstd

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: !!js process.env.ELECKOI_ENABLE_COLLABORATION_TOOLS !== 'true'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  disabled: !!js process.env.ELECKOI_ENABLE_WORKFLOW_TOOLS !== 'true'
  config:
    allowParallelInProgress: true

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  disabled: !!js process.env.ELECKOI_ENABLE_WORKSPACE_TOOLS !== 'true'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  disabled: !!js process.env.ELECKOI_ENABLE_WORKSPACE_TOOLS !== 'true'
  config:
    sampleOverCapGlobResults: false

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
