# Read docs/WINDOWS_RELEASE.md before changing this workflow.
# Publish first. Non-shipping UI/function probes belong in post-release jobs;
# never make the release job depend on them.
name: ElecKoi Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.2
        required: true
        type: string
      prerelease:
        description: Publish as a GitHub pre-release
        required: true
        default: true
        type: boolean
      source_ref:
        description: Optional verified source commit for rebuilding an existing version
        required: false
        type: string
      replace_windows_assets:
        description: Replace only Windows assets on an existing Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows installer first
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')
          $packageVersion = node -p "require('./apps/desktop/package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag $env:RELEASE_TAG does not match package.json version $packageVersion"
          }
          $sourceRef = $env:SOURCE_REF
          if ($sourceRef -and ($sourceRef -notmatch '^[0-9a-f]{40}$' -or (git rev-parse HEAD) -ne $sourceRef)) {
            throw 'A rebuild must use an exact verified source commit.'
          }

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all Electron processes
        run: pnpm build

      - name: Rebuild Electron native dependencies
        run: pnpm rebuild:electron

      - name: Verify Electron SQLite runtime
        run: pnpm check:electron-sqlite

      - name: Verify Electron DSH runtime
        run: pnpm check:electron-dsh

      - name: Assemble Windows application
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --projectDir apps/desktop --config electron-builder.config.mjs --win --x64 --dir --publish never

      - name: Verify packaged DSH runtime
        run: pnpm verify:packaged-dsh

      - name: Retain Windows package content report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-content
          path: build/windows-package-content.json
          if-no-files-found: ignore

      - name: Package verified Windows installer and update metadata
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --projectDir apps/desktop --config electron-builder.config.mjs --win --x64 --prepackaged ../../release/win-unpacked --publish never

      - name: Verify installed startup in a Low-integrity directory
        run: |
          $installer = (Get-ChildItem release -File -Filter '*-setup.exe').FullName
          node scripts/verify-windows-installer.mjs $installer
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows startup verification failed.' }

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPLACE_WINDOWS_ASSETS: ${{ inputs.replace_windows_assets }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          $assets = @(
            (Get-ChildItem release -File -Filter '*-setup.exe').FullName
            (Get-ChildItem release -File -Filter '*-setup.exe.blockmap').FullName
            (Resolve-Path release/latest.yml).Path
          )
          if ($env:REPLACE_WINDOWS_ASSETS -eq 'true') {
            # The tag endpoint omits a withdrawn draft; list owned releases to resolve its exact id.
            $pages = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not read existing Releases.' }
            $matchingReleases = @($pages | ForEach-Object { $_ } | Where-Object { $_.tag_name -eq $env:RELEASE_TAG })
            if ($matchingReleases.Count -ne 1) { throw 'Expected exactly one existing Release for this tag.' }
            $release = $matchingReleases[0]
            $before = @($release.assets | Where-Object { $_.name -notin @($assets | ForEach-Object { Split-Path -Leaf $_ }) })
            gh release upload $env:RELEASE_TAG @($assets | Where-Object { (Split-Path -Leaf $_) -ne 'latest.yml' }) --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Windows installer replacement failed.' }
            gh release upload $env:RELEASE_TAG (Resolve-Path release/latest.yml).Path --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Windows update metadata replacement failed.' }
            $after = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" | ConvertFrom-Json
            foreach ($asset in $before) {
              $retained = $after.assets | Where-Object { $_.id -eq $asset.id -and $_.name -eq $asset.name -and $_.digest -eq $asset.digest }
              if (-not $retained) { throw "An unrelated Release asset changed: $($asset.name)" }
            }
            $source = git rev-parse HEAD
            $notice = "<!-- windows-rebuild -->`nWindows 安装包已包含本次修复并重新打包。[本次 PC 构建源码](https://github.com/$env:GITHUB_REPOSITORY/commit/$source)。`n<!-- /windows-rebuild -->"
            $body = [regex]::Replace([string]$release.body, '(?s)<!-- windows-rebuild -->.*?<!-- /windows-rebuild -->\s*', '')
            $notes = Join-Path $env:RUNNER_TEMP 'rebuilt-release-notes.md'
            "$notice`n`n$body" | Set-Content -LiteralPath $notes -Encoding utf8
            gh release edit $env:RELEASE_TAG --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not record the Windows rebuild source.' }
            if ($release.draft) {
              gh release edit $env:RELEASE_TAG --draft=false --prerelease=${{ inputs.prerelease }}
              if ($LASTEXITCODE -ne 0) { throw 'Could not publish the corrected Windows release.' }
            }
            exit 0
          }
          $releaseOptions = @('--verify-tag', '--title', "ElecKoi $env:RELEASE_TAG")
          $releaseNotes = "docs/releases/$env:RELEASE_TAG.md"
          if (Test-Path -LiteralPath $releaseNotes) {
            if ($env:SOURCE_REF) {
              $source = git rev-parse HEAD
              $notice = "[本次 PC 构建源码](https://github.com/$env:GITHUB_REPOSITORY/commit/$source)。"
              $verifiedNotes = Join-Path $env:RUNNER_TEMP 'verified-release-notes.md'
              "$notice`n`n$(Get-Content -LiteralPath $releaseNotes -Raw)" | Set-Content -LiteralPath $verifiedNotes -Encoding utf8
              $releaseNotes = $verifiedNotes
            }
            $releaseOptions += @('--notes-file', $releaseNotes)
          }
          else { $releaseOptions += '--generate-notes' }
          if ('${{ inputs.prerelease }}' -eq 'true') { $releaseOptions += '--prerelease' }
          gh release create $env:RELEASE_TAG @assets @releaseOptions

  update_ui_check:
    name: Check update UI after publishing (non-blocking)
    needs: release
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout the same release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked check dependencies
        run: pnpm install --frozen-lockfile

      - name: Build update-check inputs
        run: |
          pnpm --filter eleckoi-desktop build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build:dsh-renderer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm rebuild:electron
          exit $LASTEXITCODE

      - name: Check update discovery and reopening in wide and narrow windows
        id: updates
        continue-on-error: true
        run: |
          $failedWidths = @()
          foreach ($probeWidth in @(1440, 1024)) {
            $env:ELECKOI_CLIENT_PROBE_WIDTH = [string]$probeWidth
            pnpm exec electron scripts/probe-eleckoi-desktop-client.cjs --updates-check
            if ($LASTEXITCODE -ne 0) { $failedWidths += $probeWidth }
          }
          if ($failedWidths.Count -gt 0) {
            throw "Update UI check failed at widths: $($failedWidths -join ', '). See this check's logs; Windows packaging runs independently."
          }

      - name: Report the independent check result
        if: always()
        env:
          UPDATE_CHECK_OUTCOME: ${{ steps.updates.outcome }}
        run: |
          if ($env:UPDATE_CHECK_OUTCOME -eq 'success') {
            'Update UI checks passed. This job is independent of Windows packaging.' >> $env:GITHUB_STEP_SUMMARY
          }
          else {
            Write-Output '::warning::The independent update UI check did not pass. Inspect this job to fix it; it does not block Windows packaging or publishing.'
            "Update UI check outcome: $env:UPDATE_CHECK_OUTCOME. Inspect this job's logs; Windows packaging and publishing run independently." >> $env:GITHUB_STEP_SUMMARY
          }

  functional_check:
    name: Run regression tests after publishing (non-blocking)
    needs: release
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout the same release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked test dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python image dependency
        run: python -m pip install pillow

      - name: Run regression tests
        id: tests
        continue-on-error: true
        run: pnpm test

      - name: Report the independent regression result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if ($env:TEST_OUTCOME -eq 'success') {
            'Regression tests passed after Windows publishing.' >> $env:GITHUB_STEP_SUMMARY
          }
          else {
            Write-Output '::warning::The independent regression check did not pass. Inspect this job to fix it; the installer has already been published.'
            "Regression outcome: $env:TEST_OUTCOME. Inspect this job's logs; publishing is independent." >> $env:GITHUB_STEP_SUMMARY
          }
