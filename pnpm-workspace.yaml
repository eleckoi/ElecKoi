packages:
  - .
  - apps/*
  - packages/client/features/*
  - packages/client/mobile/*
  - packages/host/*
  - packages/shared
  - packages/examples/*
  - packages/sdk/*
  - packages/compatibility/*

onlyBuiltDependencies:
  - '@deepseek-ai/dsh-subprocess-local'
  - electron
  - esbuild
  - better-sqlite3
  - koffi
  - node-pty
  - sharp

overrides:
  '@earendil-works/pi-ai': 1.3.0

# Keep the full pinned DSH patch inventory even when its packages are outside this dependency graph.
allowUnusedPatches: true
patchedDependencies:
  # RETIRE WHEN: upstream can continue the exact durable input and await per-turn preset preparation before model/tool capture.
  '@deepseek-ai/dsh-agent-loop@0.2.2-rc.5': patches/@deepseek-ai__dsh-agent-loop@0.2.2-rc.5.patch
  # RETIRE WHEN: upstream exposes owned factory activation admission before writer acquisition and returns the owned handle to the admission owner; remove this patch, bridge call and lock hash together.
  '@deepseek-ai/dsh-agent@0.2.2-rc.5': patches/@deepseek-ai__dsh-agent@0.2.2-rc.5.patch
  # RETIRE WHEN: the official Gateway logs original invocation and stream failures before wire folding; remove this patch, registration and lock hash together.
  '@deepseek-ai/dsh-api-gateway@0.2.2-rc.5': patches/@deepseek-ai__dsh-api-gateway@0.2.2-rc.5.patch
  # RETIRE WHEN: official controller supports same-session retained-input regeneration and product-safe creation.
  '@deepseek-ai/dsh-api-session-controller@0.2.2-rc.5': patches/@deepseek-ai__dsh-api-session-controller@0.2.2-rc.5.patch
  # RETIRE WHEN: upstream keeps loopback and owned Host recovery independent of browser Internet status; remove this patch, registration and lock hash together.
  '@deepseek-ai/dsh-client-connection@0.2.2-rc.5': patches/@deepseek-ai__dsh-client-connection@0.2.2-rc.5.patch
  # RETIRE WHEN: upstream exposes the product flow, pending input, running seat, logical turn navigation and user-message action seat; remove the matching sections and declarations together.
  '@deepseek-ai/dsh-client-ui-chat@0.2.2-rc.5': patches/@deepseek-ai__dsh-client-ui-chat@0.2.2-rc.5.patch
  # RETIRE WHEN: official composer exposes accessory/Enter controls, occurrence-selected composer presentation and width persistence, keeps CSS anchors stable through long history/streaming, preserves measured clearance with native wheel/text-selection association outside the history scroll chain, and binds retained mobile selections and opens the mobile command menu without requesting IME; remove matching patch sections, registration and hash together.
  # RETIRE WHEN: bundled Lexical allows ordinary Chromium Android Backspace without canceling the native input. Remove that hunk and the Android composer deletion regression.
  '@deepseek-ai/dsh-client-ui-conversation@0.2.2-rc.5': patches/@deepseek-ai__dsh-client-ui-conversation@0.2.2-rc.5.patch
  # RETIRE WHEN: the published layout bundle accepts the application title at runtime or ElecKoi builds it with DSH_CLIENT_TITLE; remove the title hunks.
  # RETIRE WHEN: upstream exposes an application-owned always-drawer sidebar mode; remove setSidebarDrawer, its frame/store branches and the product Android opt-in.
  '@deepseek-ai/dsh-client-ui-layout@0.2.2-rc.5': patches/@deepseek-ai__dsh-client-ui-layout@0.2.2-rc.5.patch
  # RETIRE WHEN: official model selection exposes provider-heading labels and a root-menu parameter slot with keyboard-safe fields and a guarded leave action; switch to them and remove this patch, registration and lock entry.
  '@deepseek-ai/dsh-client-ui-model-selection@0.2.2-rc.5': patches/@deepseek-ai__dsh-client-ui-model-selection@0.2.2-rc.5.patch
  # RETIRE WHEN: upstream supports shipped product groups with featured entries and More navigation, displays product bundle declarations and developer interface metadata, and provides a header-leading slot with transform-safe, outward-rounded toolbar measurements; remove this patch, registration and lock entry together.
  # RETIRE WHEN: upstream supports an Android file picker for local plugin packages; remove the install-dialog additions and their regression once the picker uses the upstream entry.
  '@deepseek-ai/dsh-client-ui-plugin-manager@0.2.2-rc.5': patches/@deepseek-ai__dsh-client-ui-plugin-manager@0.2.2-rc.5.patch
  # RETIRE WHEN: official settings exposes reusable, reopenable sidebar updates with portal tooltips and a language-only section sharing its LocaleRuntime.
  '@deepseek-ai/dsh-client-ui-settings-general@0.2.2-rc.5': patches/@deepseek-ai__dsh-client-ui-settings-general@0.2.2-rc.5.patch
  # RETIRE WHEN: official theme exposes an always-expanded font settings group; use that option and remove this patch, registration and lock entry.
  '@deepseek-ai/dsh-client-ui-theme@0.2.2-rc.5': patches/@deepseek-ai__dsh-client-ui-theme@0.2.2-rc.5.patch
  # RETIRE WHEN: retained inputs keep their execution/display identity and complete tool trees through the official trajectory contracts; remove this patch, registration and lock hash together.
  '@deepseek-ai/dsh-client-ui-trajectory@0.2.2-rc.5': patches/@deepseek-ai__dsh-client-ui-trajectory@0.2.2-rc.5.patch
  # RETIRE WHEN: upstream offers an explicit setting disabling automatic session selection and creation.
  '@deepseek-ai/dsh-client-ui-workspace@0.2.2-rc.5': patches/@deepseek-ai__dsh-client-ui-workspace@0.2.2-rc.5.patch
  # RETIRE WHEN: official DSH can summarize on the explicitly selected route when the previous provider is unregistered, in both /compact and pre-switch automatic compaction.
  '@deepseek-ai/dsh-compaction-basic@0.2.2-rc.5': patches/@deepseek-ai__dsh-compaction-basic@0.2.2-rc.5.patch
  # RETIRE WHEN: official adapter forwards topP through both supported protocols.
  '@deepseek-ai/dsh-llm-deepseek@0.2.2-rc.5': patches/@deepseek-ai__dsh-llm-deepseek@0.2.2-rc.5.patch
  # RETIRE WHEN: official adapter forwards topP and follows all configured Google model-list pages.
  '@deepseek-ai/dsh-llm-pi-ai@0.2.2-rc.5': patches/@deepseek-ai__dsh-llm-pi-ai@0.2.2-rc.5.patch
  # RETIRE WHEN: official call controls include topP and compare it in request identity.
  '@deepseek-ai/dsh-llm@0.2.2-rc.5': patches/@deepseek-ai__dsh-llm@0.2.2-rc.5.patch
  # RETIRE WHEN: upstream carries product developer interfaces and required product bundle guards.
  '@deepseek-ai/dsh-plugin-manager@0.2.2-rc.5': patches/@deepseek-ai__dsh-plugin-manager@0.2.2-rc.5.patch
  # RETIRE WHEN: SDK compatibility consumers use official streaming, cancel and dispose operations.
  '@deepseek-ai/dsh-sdk-jsonrpc-server@0.2.2-rc.5': patches/@deepseek-ai__dsh-sdk-jsonrpc-server@0.2.2-rc.5.patch
  # RETIRE WHEN: supported released logs with the late system head replay through the official codec without this stage.
  '@deepseek-ai/dsh-session-format-v3-to-v4@0.2.2-rc.5': patches/@deepseek-ai__dsh-session-format-v3-to-v4@0.2.2-rc.5.patch
  # RETIRE WHEN: upstream publicly exposes the writer lease needed by coordinated editing.
  '@deepseek-ai/dsh-session-persistence-jsonl@0.2.2-rc.5': patches/@deepseek-ai__dsh-session-persistence-jsonl@0.2.2-rc.5.patch
  # RETIRE WHEN: supported product event identities can be appended as ignorable records without renaming persisted events.
  '@deepseek-ai/dsh-session@0.2.2-rc.5': patches/@deepseek-ai__dsh-session@0.2.2-rc.5.patch
  # RETIRE WHEN: explicit continuation output can bypass secondary spilling through an official contract.
  '@deepseek-ai/dsh-spill-policy@0.2.2-rc.5': patches/@deepseek-ai__dsh-spill-policy@0.2.2-rc.5.patch
  # RETIRE WHEN: official tools support complete provider output.
  '@deepseek-ai/dsh-tool-web@0.2.2-rc.5': patches/@deepseek-ai__dsh-tool-web@0.2.2-rc.5.patch
  # RETIRE WHEN: official tools expose the exact registration context under the same scope and visibility rules (ADR 0041).
  '@deepseek-ai/dsh-tools@0.2.2-rc.5': patches/@deepseek-ai__dsh-tools@0.2.2-rc.5.patch
  # RETIRE WHEN: official generator handles this product TypeScript declaration graph.
  '@deepseek-ai/dsh-typert-generator@0.2.2-rc.5': patches/@deepseek-ai__dsh-typert-generator@0.2.2-rc.5.patch
  # RETIRE WHEN: the official desktop Web entry preserves thrown object fields, original stacks and nested causes before its string-only boot failure bridge.
  '@deepseek-ai/dsh-web-frontend@0.2.2-rc.5': patches/@deepseek-ai__dsh-web-frontend@0.2.2-rc.5.patch
  # RETIRE WHEN: the pinned DSH manifest retires its unchanged oar patch and the new runtime passes the matching regression.
  '@botiverse/oar@0.67.0': patches/@botiverse__oar@0.67.0.patch
  # RETIRE WHEN: official provider serializers expose topP across supported protocols.
  # RETIRE WHEN: pi-ai round-trips Gemini Chat Completions signatures without the locked DSH signature hunks.
  # RETIRE WHEN: pi-ai stops reparsing accumulated tool arguments on each delta, making the locked DSH stream hunks redundant.
  '@earendil-works/pi-ai@1.3.0': patches/@earendil-works__pi-ai@1.3.0.patch
  # RETIRE WHEN: the pinned DSH manifest retires each of these unchanged upstream patches and affected build or runtime regressions pass without it.
  # Applies individually to osx-sign, both fortune-sheet packages, pkg, exceljs and lexical.
  '@electron/osx-sign@1.3.3': patches/@electron__osx-sign@1.3.3.patch
  '@fortune-sheet/core@1.0.4': patches/@fortune-sheet__core@1.0.4.patch
  '@fortune-sheet/react@1.0.4': patches/@fortune-sheet__react@1.0.4.patch
  '@yao-pkg/pkg@6.21.0': patches/@yao-pkg__pkg@6.21.0.patch
  exceljs@4.4.0: patches/exceljs@4.4.0.patch
  lexical@0.49.0: patches/lexical@0.49.0.patch
  # RETIRE WHEN: these GFM packages keep CJK punctuation outside literal links without the locked DSH patches.
  mdast-util-gfm-autolink-literal@2.0.1: patches/mdast-util-gfm-autolink-literal@2.0.1.patch
  micromark-extension-gfm-autolink-literal@2.1.0: patches/micromark-extension-gfm-autolink-literal@2.1.0.patch
  # RETIRE WHEN: node-pty locates external spawn helpers and drains exited Windows consoles without the locked DSH patch.
  node-pty@1.2.0-beta.15: patches/node-pty@1.2.0-beta.15.patch
  # Backports electron-builder PR #10323 for pnpm deduplicated dependency closures.
  # RETIRE WHEN: the locked builder supports official ULMO and collects deduplicated pnpm production closures; remove the patch, registration and lock hash together.
  # Also backports target cpu/os filtering from electron-builder cecf43a601fe4a3c769398fdc7bc278c57292515.
  # RETIRE WHEN: the locked builder passes the target arch/platform into every production collector and excludes incompatible package subtrees; remove those patch sections and refresh the lock hash together.
  app-builder-lib@26.17.0: patches/app-builder-lib@26.17.0.patch

# The Android Host runs in Linux ARM64 glibc; keep its optional native image
# dependencies installed when preparing that runtime from the Windows checkout.
supportedArchitectures:
  cpu: [ current, arm64 ]
  libc: [ glibc ]
  os: [ current, linux ]
