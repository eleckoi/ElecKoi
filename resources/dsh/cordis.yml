# ElecKoi-owned DeepSeek Harness JSON-RPC runtime composition.
# stdout is reserved for the SDK protocol; runtime diagnostics must use stderr.

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: !!js process.env.ELECKOI_AGENT_PRESET ?? 'agent-preset-standard'
    includeUserRoot: true

# The stock JSON-RPC server creates an Agent without a setup hook. This bridge
# mounts the selected ElecKoi preset before that Agent is published.
- id: agent-preset-bridge
  name: './agent-preset-bridge.mjs'

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'
  config:
    dshHome: !!js process.env.DSH_HOME
    maxImageBytes: 20971520
    maxImagesPerMessage: 4
    maxMessageImageBytes: 20971520

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      eleckoi-upstream:
        displayName: ElecKoi configured provider
        apiKeyEnv: ELECKOI_API_KEY
        api: !!js process.env.ELECKOI_API_FORMAT ?? 'openai-responses'
        baseURL: !!js process.env.ELECKOI_BASE_URL ?? 'https://api.deepseek.com'
        headers: !!js JSON.parse(process.env.ELECKOI_CUSTOM_HEADERS ?? '{}')
        reasoning: !!js process.env.ELECKOI_REASONING_EFFORT || undefined
        defaultInput:
          - text
        models:
          - id: !!js process.env.DSH_MODEL ?? 'deepseek-chat'
            input: !!js JSON.parse(process.env.ELECKOI_MODEL_INPUT_MODALITIES ?? '["text"]')
            contextWindow: !!js Number(process.env.ELECKOI_CONTEXT_WINDOW ?? 272000)
            maxTokens: !!js Number(process.env.ELECKOI_MAX_TOKENS ?? 32768)
            reasoningEfforts:
              off:
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
      eleckoi-subagent:
        displayName: ElecKoi configured subagent provider
        apiKeyEnv: ELECKOI_SUBAGENT_API_KEY
        api: !!js process.env.ELECKOI_SUBAGENT_API_FORMAT ?? 'openai-responses'
        baseURL: !!js process.env.ELECKOI_SUBAGENT_BASE_URL ?? 'https://api.deepseek.com'
        headers: !!js JSON.parse(process.env.ELECKOI_SUBAGENT_CUSTOM_HEADERS ?? '{}')
        reasoning: !!js process.env.ELECKOI_SUBAGENT_REASONING_EFFORT || undefined
        defaultInput:
          - text
        models:
          - id: !!js process.env.ELECKOI_SUBAGENT_MODEL ?? 'deepseek-chat'
            input: !!js JSON.parse(process.env.ELECKOI_SUBAGENT_MODEL_INPUT_MODALITIES ?? '["text"]')
            contextWindow: !!js Number(process.env.ELECKOI_SUBAGENT_CONTEXT_WINDOW ?? 272000)
            maxTokens: !!js Number(process.env.ELECKOI_SUBAGENT_MAX_TOKENS ?? 32768)
            reasoningEfforts:
              off:
              minimal: minimal
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max

# Web search is one DSH capability seam with an explicit provider per runtime.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: !!js process.env.DSH_WEB_SEARCH_PROVIDER ?? 'deepseek-official'
    fetchProvider: http

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  config:
    apiKeyEnv: ELECKOI_NATIVE_WEB_SEARCH_API_KEY

- id: web-search-tavily
  name: './tavily-web-search.mjs'

- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'
  config:
    maxUrlLength: 2048
    maxResponseBytes: 5000000
    maxBodyChars: 100000
    timeoutMs: 35000
    maxRedirects: 5

- id: tool-call-timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'

# Windows-local command execution and managed subprocess trees.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: pwsh
  name: '@deepseek-ai/dsh-pwsh-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 120000
    maxTimeoutMs: 600000

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

# Character chat follows the current Android policy: high-risk operations are
# audited and rejected instead of opening an interactive grant surface.
- id: user-approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

# The full UI-less agent spine owns sessions, tools, skills, jobs, goals,
# system-prompt assembly, retries, invariants and the concrete agent loop.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: true
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are ElecKoi, a helpful desktop AI assistant.'
    dshHome: !!js process.env.DSH_HOME
    maxParallelToolCalls: 4
    workspaceContext: false
    skills:
      enabled: true
    toolBash: false
    toolJobs: {}
    goals: {}

- id: request-config
  name: './request-config.mjs'

- id: conversation-context
  name: './conversation-context.mjs'

- id: tool-policy
  name: './tool-policy.mjs'

# DSH keeps its event-sourced runtime state; ElecKoi SQLite remains the
# authoritative product database shown to the Renderer.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

# In-process subagents: continuable spawn plus one-shot history-preserving fork.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork

# Model-authored workflows dispatch child agents through the same spawn provider.
- id: workflow-worker
  name: '@deepseek-ai/dsh-workflow-worker-thread'
  config:
    provider: spawn

# Workspace file tools and the observe-before-edit policy.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

# Long-session context accounting. Compaction is part of the selected preset.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# Start the transport only after every host registry and adapter is available.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true
