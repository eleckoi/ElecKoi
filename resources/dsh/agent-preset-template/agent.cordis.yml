# ElecKoi agent preset Agent plane. A runtime copy is materialized for every
# product preset and mounted through @deepseek-ai/dsh-agent-presets.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ELECKOI:variables:BEGIN
- id: variable-tools
  name: __ELECKOI_VARIABLE_TOOLS_PLUGIN__
# ELECKOI:variables:END

# ELECKOI:setting-library:BEGIN
- id: setting-library-tools
  name: __ELECKOI_SETTING_LIBRARY_TOOLS_PLUGIN__
# ELECKOI:setting-library:END

# ELECKOI:web:BEGIN
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: true
    fetch: true
    searchMaxResults: !!js Number(process.env.ELECKOI_WEB_SEARCH_MAX_RESULTS ?? 5)
    searchMaxQueries: 3
    searchTimeoutMs: 35000
    fetchTimeoutMs: 30000
    fetchMaxOutputChars: 120000
# ELECKOI:web:END

# ELECKOI:workspace:BEGIN
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  config:
    enableRunInBackground: true

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
# ELECKOI:workspace:END

# ELECKOI:collaboration:BEGIN
- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 2
__ELECKOI_SUBAGENT_OPTIONS__

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 2
__ELECKOI_SUBAGENT_OPTIONS__
# ELECKOI:collaboration:END

# ELECKOI:roleplay-workflow:BEGIN
- id: roleplay-plan-tool
  name: __ELECKOI_ROLEPLAY_PLAN_TOOL_PLUGIN__
# ELECKOI:roleplay-workflow:END

# ELECKOI:workflow:BEGIN
- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
# ELECKOI:workflow:END

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: !!js Number(process.env.ELECKOI_COMPACTION_THRESHOLD_RATIO ?? 0.8)
        retainRatio: 0.16
        maxTokens: 8192
        compactionRetries: 1
